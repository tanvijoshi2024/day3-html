<!DOCTYPE html>
<html>
    <head>
        <style>
            .ride{
                font-size:80px;
                font-weight: 20px;
                font-family:arial;
                margin-top:10px;
                margin-bottom: 0;
            }
            .pickup{
                width: 300px;
                height: 30px;
               display:block;
                margin: 10px;
                border:none;
                background-color:whitesmoke;
                
            }
            .enter{
                width: 300px;
                height: 30px;
                display:block;
                margin: 10px;
                border:none;
                background-color:whitesmoke;
            }
            .now{
                width: 120px;
                height: 40px;
                border:none;
                background-color: rgb(0, 0, 0);
                color:white;
                margin:10px;
               
            }
            .for{
               width: 120px;
                height: 40px;
                margin-left:10px; 
                border:none;
            }
        </style>
    </head>
    <body>
        <p class="ride">Request a ride now</p>
        <input class="pickup" type="text" placeholder="Enter pickup location">
        <input  class="enter" type ="text" placeholder="Enter destination">
        <button class="now">Request now</button><button class="for">Schedule for later</button>
    </body>
</html>
