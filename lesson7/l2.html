<!DOCTYPE html>
<html>
    <head>
        <style>
            .i{
                width:200px;
                border-radius: 20px;
            }
            .j{
                width:300px;
                height:300px;  
                margin-left:200px;
                object-fit: contain;
                border-width:2px;
                border-style:solid;
                border-color:blue;
            }
            .k{
                width:300px;
                border-radius:100%;
                margin-left:250px;
            }
        </style>
    </head>
<body>
    <img class="i" src="image.avif">
    <img class="j" src="image.avif">
    <img class="k" src="image.avif">
</body>
</html>
