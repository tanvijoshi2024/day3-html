<!DOCTYPE html>
<html>
    <head>
        <style>
            .hq{
                width: 100px;
                height: 100px;
                border-radius: 50%;
                display:inline-block;
               
            }
            .hp{
                width: 200px;
                height: 70px;
                border-radius: 10px;
                border:none;
                font-size:20px;
                display:inline-block;

            }
            .tweet{
                background-color: blue;
                color:white;
                border-radius: 20px;
                border:none;
                font-size:20px;
                display:inline-block;
                height : 40px;
                width : 80px;
                
            }
        </style>
    </head>
    <body>
        <img  class="hq" src="image.avif">
        <input class="hp" type="text" placeholder="What's happening?">
        <button class="tweet">Tweet</button>
    </body>
</html
